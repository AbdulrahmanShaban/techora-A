", "t": "نتعرف على لغة CSS وفوائدها وصيغتها العامة."}, {"type": "table", "h": "HTML مقابل CSS", "head": ["اللغة", "ما وظيفتها؟"], "rows": [["HTML", "لغة تكويد لإنشاء صفحات مواقع الإنترنت، ويتم عرضها باستخدام برامج التصفح."], ["CSS", "تُستخدم لتنسيق مظهر صفحة الويب (لون الصفحة، ولون وحجم الخط)، وتتحكم في تنسيق العديد من الصفحات في وقت واحد."]]}, {"type": "text", "h": "لماذا ظهرت CSS؟", "t": "درسنا HTML وهي لغة تكويد تنشئ صفحات الويب الثابتة وتُعرض بالمتصفحات، وقد صُمّمت <b>لوصف محتوى</b> الصفحة. ولتنسيقها أُضيفت وسوم مثل <code>&lt;font&gt;</code> وسمات الألوان، فصار تطوير المواقع الكبيرة مرهقًا لأن التنسيق يُضاف لكل صفحة على حدة. فأنشأ اتحاد شبكة الويب العالمية <b>W3C</b> لغة <b>CSS (Cascading Style Sheets)</b> فلم تعد هناك حاجة لإضافة وسوم تنسيق داخل HTML!"}, {"type": "text", "t": "نستخدم CSS لتنسيق مظهر الصفحات (لون الخط، حجمه، لون الصفحة...) وتوفّر الكثير من الجهد لأنها تتحكم في تنسيق <b>عدة صفحات في آن واحد</b>."}, {"type": "cards", "items": [["⏱️", "توفير الوقت", "ملف CSS واحد يُضمّن في أي عدد من الصفحات."], ["⚡", "سرعة التحميل", "يحمّله المتصفح مرة واحدة ويخزنه ويعيد استخدامه."], ["✏️", "سهولة التعديل", "تعديل الملف يعدّل كل الصفحات المرتبطة به تلقائيًا."], ["✨", "تحسين المظهر الجمالي", "صفحة أجمل وأكثر تنظيمًا."], ["👓", "تحسين سهولة القراءة", "اختيار الخطوط والألوان المناسبة."], ["🧱", "فصل التصميم والتنسيق عن محتوى الصفحة", "تغيير الشكل دون تغيير بنية HTML."], ["📱", "بناء صفحات متجاوبة ومتناسبة", "Responsive: تظهر مناسبة للكمبيوتر والموبايل والتابلت."]], "h": "فوائد لغة CSS"}, {"type": "raw", "h": "البنية الأساسية لـ CSS", "t": "<div class=\"card\"><p>الصيغة العامة:</p></div>"}, {"type": "code", "t": "Selector { Property: Value; }\n/*  المحدد      الخاصية   القيمة  */", "cap": "الصيغة العامة"}, {"type": "cards", "items": [["🎯", "المحدد Selector", "يمثل عنصر HTML أو مجموعة العناصر التي ستطبق عليها التنسيقات، مثل body."], ["🔧", "الخاصية Property", "تحدد ما الذي تريد تغييره: اللون، الحجم، المسافة..."], ["🎚️", "القيمة Value", "تحدد كيف تريد تغيير الخاصية."]]}, {"type": "code", "t": "h1 {\n  color: brown;\n  font-size: 24px;\n}", "cap": "مثال: عناوين h1 تصبح بنية اللون وحجمها 24 بكسل"}, {"type": "act", "k": "✍️ نشاط تعليمي", "t": "يكتب المعلم كود CSS بسيطًا ويوضح أجزاءه. حدّد في <code dir=\"ltr\">h1 { color: brown; }</code>: من هو <b>المحدد</b>؟ ومن هي <b>الخاصية</b>؟ وما <b>القيمة</b>؟", "gold": false}, {"type": "act", "k": "🙋 أداء صفي", "t": "اذكر خاصية CSS واحدة وردت في الدرس (مثل <code dir=\"ltr\">color</code> أو <code dir=\"ltr\">font-size</code>).", "gold": false}, {"type": "text", "h": "📗 الحصة الثانية • كيف نضيف CSS إلى صفحة HTML؟", "t": "نتعلم طرق إدراج CSS، وكيف نكتب ملفًا خارجيًا ونربطه بالصفحة."}, {"type": "table", "h": "ثلاث طرق لإدراج CSS", "head": ["الطريقة", "ماذا تفعل؟", "متى نستخدمها؟"], "rows": [["Inline مضمّنة", "تُستخدم لتطبيق تنسيقات مباشرة على عناصر صفحة الويب", "لتنسيق عنصر واحد بسرعة"], ["Internal داخلية", "تُستخدم لتنسيق صفحات الويب الفردية", "لتنسيق صفحة واحدة"], ["External خارجية", "ملف .css منفصل يُستخدم في المواقع الكبيرة لتوحيد تصميم وتنسيق صفحات الموقع", "المواقع الكبيرة"]]}, {"type": "steps", "h": "كتابة CSS الخارجي", "items": [["١", "أنشئ ملفًا منفصلًا بامتداد <b>.css</b> (مثل style.css)."], ["٢", "اكتب فيه قواعد التنسيق فقط، <b>ولا يحتوي أي وسم HTML</b>."], ["٣", "اربطه بكل صفحة بالوسم <code>&lt;link&gt;</code> داخل منطقة <code>head</code>."], ["٤", "غيّر مظهر <b>كل صفحات الموقع</b> بالتعديل في هذا الملف الواحد فقط."]]}, {"type": "code", "t": "&lt;link href=\"filename.css\" rel=\"stylesheet\"&gt;", "cap": "كود ربط ملف CSS بصفحة HTML"}, {"type": "cards", "items": [["🔗", "href", "اسم ملف CSS ومساره."], ["🔖", "rel=\"stylesheet\"", "يخبر المتصفح أن الملف ورقة أنماط CSS يجب تحميلها وتطبيقها على الصفحة."]]}, {"type": "code", "t": "&lt;html&gt;\n&lt;head&gt;\n  &lt;link rel=\"stylesheet\" href=\"mystyle.css\"&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;هنا عنوان الصفحة&lt;/h1&gt;\n  &lt;p&gt;هنا يظهر المحتوى&lt;/p&gt;\n&lt;/body&gt;\n&lt;/html&gt;", "cap": "ملف HTML"}, {"type": "code", "t": "body { background-color: lightblue; }\nh1 { color: brown; font-size: 24px; }", "cap": "ملف mystyle.css"}, {"type": "text", "t": "<b>لاحظ:</b> العنصر <code>body</code> في CSS يؤثر على منطقة body في HTML ويجعلها <b>أزرق فاتح</b>، والعنصر <code>h1</code> يجعل العناوين الرئيسية <b>بنية بحجم 24 بكسل</b>."}, {"type": "text", "h": "🏫 تطبيق: كود صفحة بيانات المدرسة", "t": "هذا هو كود HTML الخاص بصفحة بيانات المدرسة، وفيه نربط الصفحة بملف التنسيق <code dir=\"ltr\">style.css</code>."}, {"type": "code", "t": "&lt;html&gt;\n&lt;head&gt;\n  &lt;title&gt;بيانات المدرسة&lt;/title&gt;\n  &lt;link rel='stylesheet' href='style.css'&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div class=\"container\"&gt;\n    &lt;header&gt;\n      &lt;h1&gt;مدرسة [اسم المدرسة] الإعدادية&lt;/h1&gt;\n    &lt;/header&gt;\n\n    &lt;section&gt;\n      &lt;h2&gt;معلومات أساسية&lt;/h2&gt;\n      &lt;img src=\"sc.jpg\" width=\"300\" height=\"200\"&gt;&lt;br&gt;&lt;br&gt;\n      اسم المدرسة: [اسم المدرسة بالكامل] &lt;br&gt;&lt;br&gt;\n      العنوان: [عنوان المدرسة بالتفصيل] &lt;br&gt;&lt;br&gt;\n      رقم الهاتف: [رقم هاتف المدرسة] &lt;br&gt;&lt;br&gt;\n    &lt;/section&gt;\n\n    &lt;section&gt;\n      &lt;h2&gt;أنشطة المدرسة&lt;/h2&gt;\n      اذكر نشاطًا أو اثنين من الأنشطة المتاحة في المدرسة &lt;br&gt;&lt;br&gt;\n    &lt;/section&gt;\n  &lt;/div&gt;\n&lt;/body&gt;\n&lt;/html&gt;", "cap": "كود HTML الخاص بصفحة بيانات المدرسة"}, {"type": "cards", "h": "شرح كود HTML", "items": [["📄", "&lt;html&gt;", "العنصر الأساسي الذي يحتوي على كامل محتويات الصفحة."], ["🧠", "&lt;head&gt;", "يحتوي على معلومات مهمة للمتصفح ولا تظهر ضمن محتوى الصفحة نفسها، مثل title."], ["🏷️", "&lt;title&gt;", "يحدد العنوان الذي يظهر في شريط المتصفح."], ["🔗", "&lt;link rel='stylesheet' href='style.css'&gt;", "يربط ملف HTML بملف CSS خارجي باسم style.css يُستخدم لتنسيق الصفحات."]]}, {"type": "code", "t": ".container { width: 80%; margin: auto; }\nheader { background-color: darkgreen; color: white; text-align: center; }\nh2 { color: darkgreen; }", "cap":
