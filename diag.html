<!doctype html><html lang="ar" dir="rtl"><head><script src="assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تشخيص الانضمام | Techora</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth-core.js"></script><script src="techora-config.js"></script><script src="assets/data.js"></script><script src="auth-guard.js" data-root=""></script>
<style>body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:18px;line-height:1.7}.w{max-width:680px;margin:0 auto}input,button{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}button{background:var(--green);color:var(--on-green);font-weight:800;cursor:pointer;border:0}input{text-transform:uppercase;letter-spacing:2px;direction:ltr}.r{padding:10px 14px;border-radius:12px;border:1px solid var(--line);margin:8px 0;word-break:break-word;font-size:14px}.ok{border-color:var(--green)}.no{border-color:var(--bad)}code{direction:ltr;display:inline-block}</style></head><body><div class="w"><h2>🔎 تشخيص مشكلة الانضمام للفصل</h2><p>اكتب كود الفصل واضغط «تشخيص». ثم صوّر النتيجة وابعتها.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="c" maxlength="8" placeholder="كود الفصل"><button id="b">تشخيص</button></div><div id="o"></div></div>
<script>
(function(){var $=function(i){return document.getElementById(i)},O=$('o');
function add(ok,t,d){var e=document.createElement('div');e.className='r '+(ok?'ok':'no');e.innerHTML=(ok?'✅ ':'❌ ')+t+(d?'<br><code>'+String(d).replace(/[<>&]/g,'')+'</code>':'');O.appendChild(e)}
function er(e){return (e&&e.code?e.code+' — ':'')+(e&&e.message?e.message:JSON.stringify(e))}
$('b').onclick=function(){O.innerHTML='';var code=$('c').value.trim().toUpperCase(),u=TA.auth.currentUser;if(!u){add(0,'لست مسجّل الدخول');return}
 var d=firebase.firestore(),ur=d.collection('users').doc(u.uid),cr=d.collection('classes').doc(code);add(1,'الحساب: '+u.email,u.uid);
 ur.get().then(function(s){var v=s.data()||{};add(s.exists,'قراءة مستند المستخدم','role='+v.role+' | classIds='+JSON.stringify(v.classIds)+' | teacherIds='+JSON.stringify(v.teacherIds));return cr.get()},function(e){add(0,'قراءة مستند المستخدم فشلت',er(e));return cr.get()}).then(function(c){
  if(!c.exists){add(0,'الفصل غير موجود بهذا الكود (أو لا تملك صلاحية قراءته)');throw 'stop'}add(1,'قراءة الفصل',JSON.stringify(c.data()));return ur.get().then(function(s){return[c.data(),s.data()||{}]})},function(e){add(0,'قراءة الفصل فشلت (القواعد الجديدة غالبًا غير منشورة)',er(e));throw 'stop'}).then(function(a){
  var cd=a[0],o=a[1],oc=o.classIds||[],ot=o.teacherIds||[];if(oc.indexOf(code)>=0){add(1,'أنت منضم بالفعل لهذا الفصل');throw 'stop'}
  var b=d.batch();b.set(cr.collection('members').doc(u.uid),{uid:u.uid,displayName:(u.displayName||'').slice(0,80),email:u.email||'',joinedAt:firebase.firestore.FieldValue.serverTimestamp()});b.update(ur,{classIds:oc.concat([code]),teacherIds:ot.concat([cd.teacherUid])});
  return b.commit().then(function(){add(1,'الانضمام نجح (دفعة واحدة)')},function(e){add(0,'الدفعة فشلت',er(e));
   return cr.collection('members').doc(u.uid).set({uid:u.uid,displayName:(u.displayName||'').slice(0,80),email:u.email||'',joinedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){add(1,'إنشاء مستند العضوية وحده نجح');return ur.update({classIds:oc.concat([code]),teacherIds:ot.concat([cd.teacherUid])}).then(function(){add(1,'تحديث مستند المستخدم نجح')},function(e2){add(0,'تحديث مستند المستخدم فشل (هنا المشكلة في قاعدة users)',er(e2))})},function(e1){add(0,'إنشاء مستند العضوية فشل (المشكلة في قاعدة members)',er(e1))})})}).catch(function(e){if(e!=='stop')add(0,'خطأ غير متوقع',er(e))})}})();
</script></body></html>
